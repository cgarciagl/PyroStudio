name: Reporte de Error (Bug Report)
description: Informa de un fallo, comportamiento inesperado o error en PyroStudio
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema. Completa los siguientes campos para ayudarnos a reproducirlo y solucionarlo.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica qué ocurrió de forma clara y concisa.
      placeholder: Al ejecutar una consulta con...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Pasos exactos para reproducir el fallo.
      value: |
        1. Abrir conexión con...
        2. Ir a la pestaña...
        3. Ejecutar...
        4. Observar el error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué esperabas que ocurriera.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema Operativo
      options:
        - Windows 11 / 10
        - macOS (Apple Silicon M1/M2/M3)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora)
        - Otro
    validations:
      required: true

  - type: dropdown
    id: db_engine
    attributes:
      label: Motor de Base de Datos
      options:
        - MariaDB 11.x
        - MariaDB 10.x
        - MySQL 8.4 LTS / 8.0
        - MySQL 5.7
        - Otro
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Tipo de Conexión
      options:
        - Directa TCP (con o sin TLS)
        - Reenvío SSH
        - Túnel HTTP (ntunnel_mysql.php)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Mensaje de error o detalles técnicos
      description: Pega aquí el mensaje de error o captura (¡NO incluyas contraseñas, tokens ni datos sensibles!).

