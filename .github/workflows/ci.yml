name: PyroStudio CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-validation:
    name: Rust Backend (fmt, check, test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Run cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Run cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

  frontend-validation:
    name: Frontend (test, build)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run TypeScript & Vite build
        run: npm run build

  php-tunnel-validation:
    name: PHP Tunnel (lint, security tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint tunnel script
        run: php -l tunnel/pyro_tunnel.php

      - name: Lint SQLite tunnel script
        run: php -l tunnel/pyro_tunnel_sqlite.php

      - name: Run tunnel security tests
        run: php tunnel/tests/tunnel_test.php

      - name: Run tunnel allowlist unit tests
        run: php tunnel/tests/tunnel_hosts_test.php

      - name: Run SQLite tunnel tests
        run: php tunnel/tests/tunnel_sqlite_test.php
