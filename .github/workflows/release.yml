name: PyroStudio Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (formato vX.Y.Z, ej. v0.1.2)'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validar Formato de Versión
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Determinar y validar versión de lanzamiento
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${{ github.ref_name }}"
          fi

          # Validar formato estricto semver vX.Y.Z[-prerelease]
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::La etiqueta o version de release '$RAW_VERSION' no cumple con el formato semver requerido (vX.Y.Z)."
            exit 1
          fi

          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión validada con éxito: $RAW_VERSION"

  build-and-release:
    name: Build & Package (${{ matrix.platform }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    env:
      HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            args: ''
            rust_targets: ''
          # Binario universal (Apple Silicon + Intel) en un solo .dmg
          - os: macos-latest
            platform: macos-universal
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Ubuntu 22.04 (glibc más antigua) para que los binarios corran en más distros
          - os: ubuntu-22.04
            platform: linux-x64
            args: ''
            rust_targets: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ matrix.os }}-release-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-release-cargo-

      - name: Install npm dependencies
        run: npm ci

      # El frontend lo compila Tauri vía beforeBuildCommand (npm run build)

      # Firma de artefactos del updater de Tauri: solo se activa si el secreto existe
      # (ver CONTRIBUTING.md, «Firma de releases»). Sin secreto, el build sigue sin firmar.
      - name: Configure Tauri signing key (if configured)
        if: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<PYRO_EOF"
            echo "$KEY"
            echo "PYRO_EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<PYRO_EOF"
            echo "$KEY_PASSWORD"
            echo "PYRO_EOF"
          } >> "$GITHUB_ENV"

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ needs.validate-version.outputs.release_version }}
          releaseName: 'Pyro Studio ${{ needs.validate-version.outputs.release_version }}'
          releaseBody: |
            ## 🚀 Pyro Studio ${{ needs.validate-version.outputs.release_version }}
            
            Cliente nativo, ultraligero y de alto rendimiento para MariaDB & MySQL.
            
            ### 📦 Artefactos incluidos
            - **Windows (x64):** Instalador NSIS (`.exe`) / MSI / ejecutable portable (`_portable.exe`)
            - **macOS (Universal):** Paquete nativo `.dmg` y `.app`
            - **Linux (x64):** `.AppImage` y `.deb`
            
            ### ⚠️ Primera ejecución (binarios sin firma de código)
            - **Windows portable:** requiere WebView2 (incluido en Windows 11 y casi siempre presente en Windows 10).
            - **Windows:** si aparece SmartScreen, pulsa «Más información» → «Ejecutar de todas formas».
            - **macOS:** la app no está firmada ni notarizada por Apple. Tras copiarla a Aplicaciones, ejecuta en Terminal:
              `xattr -cr "/Applications/Pyro Studio.app"`
              (o clic derecho sobre la app → «Abrir»).
            - **Linux (AppImage):** `chmod +x Pyro*.AppImage` antes de ejecutarla.

            ### 🔐 Verificación de Integridad
            Los paquetes y ejecutables son generados directamente en entornos limpios de GitHub Actions.
          releaseDraft: true
          prerelease: false

      # Ejecutable portable de Windows: reutiliza el binario ya compilado por tauri-action
      # (incluye el frontend embebido) y lo sube al mismo release, sin recompilar.
      - name: Upload Windows portable executable
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.release_version }}
        run: |
          PORTABLE="PyroStudio_${VERSION}_x64_portable.exe"
          cp src-tauri/target/release/pyro-studio.exe "$PORTABLE"
          gh release upload "$VERSION" "$PORTABLE" --clobber --repo "${{ github.repository }}"
